<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#122c2d"><title>БУР: Забытые внизу</title>
<link rel="stylesheet" href="./src/style.css">
</head>
<body>
<main id="game" aria-label="БУР: Забытые внизу">
<div id="canvas-host" aria-hidden="true"></div>
<div id="ui" aria-live="polite"></div>
<div id="loading" role="status">Запускаем системы бункера №72…</div>
</main>
<dialog id="dialog" aria-labelledby="dialog-title"><div class="dialog-shell"><h2 id="dialog-title"></h2><div id="dialog-body"></div><button class="metal-button close-dialog" type="button">НАЗАД</button></div></dialog>
<script>
window.addEventListener('error', function (event) {
  var loading = document.getElementById('loading');
  var missingFile = event.target && event.target.tagName === 'SCRIPT';
  if (missingFile || event.error) {
    loading.hidden = false;
    loading.textContent = 'Не удалось запустить игру. Проверьте, что папка public находится рядом с index.html, и обновите страницу.';
  }
}, true);
</script>
<script src="./public/vendor/phaser.min.js"></script><script src="./public/game.js?v=dirt-sprite-5"></script>
</body></html>
